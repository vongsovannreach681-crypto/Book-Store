<header class="header">
  <div class="header-inner">
    <a class="brand-wrap" routerLink="/" (click)="closeMenu()" aria-label="Go to home">
      <img src="NobgLogo.png" alt="Logo" class="brand-logo" />
    </a>

    <button
      type="button"
      class="btn btn-outline-primary burger-btn d-md-none"
      (click)="toggleMenu()"
      [attr.aria-expanded]="menuOpen()"
      aria-label="Toggle navigation"
    >
      <i class="bi" [class.bi-list]="!menuOpen()" [class.bi-x-lg]="menuOpen()"></i>
    </button>

    <nav class="nav-shell" [class.open]="menuOpen()">
      <div class="nav-links fw-semibold">
        <a
          routerLink="/"
          routerLinkActive="text-warning active-link"
          [routerLinkActiveOptions]="{ exact: true }"
          class="menu-item poppins"
          (click)="closeMenu()"
        >
          Home
        </a>
        <a
          routerLink="/books"
          routerLinkActive="text-warning active-link"
          class="menu-item poppins"
          (click)="closeMenu()"
        >
          Books
        </a>
        <a
          routerLink="/about"
          routerLinkActive="text-warning active-link"
          class="menu-item poppins"
          (click)="closeMenu()"
        >
          About
        </a>
        <a
          routerLink="/contact"
          routerLinkActive="text-warning active-link"
          class="menu-item poppins"
          (click)="closeMenu()"
        >
          Contact
        </a>
      </div>

      <div class="actions">
        <ng-container *ngIf="currentUser(); else guestActions">
          <div class="user-chip">
            <div class="user-avatar">
              <img *ngIf="getAvatarUrl(); else avatarFallback" src=""alt="Profile" />
              <ng-template #avatarFallback>
                <span>{{ getDisplayName().charAt(0) }}</span>
              </ng-template>
            </div>
            <div class="user-meta">
              <strong>{{ getDisplayName() }}</strong>
            </div>
          </div>

          <button type="button" class="btn btn-outline-danger poppins " (click)="logout()">
            Logout <span><i class="bi bi-box-arrow-right"></i></span>
          </button>
        </ng-container>

        <ng-template #guestActions>
          <a routerLink="/register" class="btn btn-outline-primary poppins ">
            Register <span><i class="bi bi-person-plus"></i></span>
          </a>
          <a routerLink="/login" class="btn btn-primary poppins ">
            Login <span><i class="bi bi-box-arrow-in-right"></i></span>
          </a>
        </ng-template>
      </div>
    </nav>
  </div>
</header>

<router-outlet />
